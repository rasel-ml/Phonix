name: Build debug APK

on:
  # push:
    # branches: [ main ]
    # paths:
      # - 'apk/**'
  # pull_request:
    # branches: [ main ]
    # paths:
      # - 'apk/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew :apk:assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: phonix-debug-apk
          path: apk/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
