plugins {
    id "com.android.application"
    id "kotlin-android"
    id "kotlin-kapt"
    id "dagger.hilt.android.plugin"
}

android {
    namespace "app.mrm.phonix"
    compileSdk rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId "app.mrm.phonix"
        minSdk rootProject.ext.minSdkVersion
        targetSdk rootProject.ext.targetSdkVersion
        versionCode 83
        versionName "1.7.0"
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    buildFeatures {
        viewBinding true
        dataBinding true
    }

    kapt { correctErrorTypes true }
    lint { checkReleaseBuilds false }
}

dependencies {
    kapt "com.google.dagger:hilt-compiler:${rootProject.ext.hiltVersion}"
    implementation "com.google.dagger:hilt-android:${rootProject.ext.hiltVersion}"

    // androidx
    implementation "androidx.core:core-ktx:1.9.0"
    implementation "androidx.appcompat:appcompat:1.6.0"
    implementation "androidx.fragment:fragment-ktx:1.5.5"
    implementation "androidx.activity:activity-ktx:1.6.1"
    implementation "androidx.preference:preference-ktx:1.2.0"
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:2.5.1"
    implementation "androidx.constraintlayout:constraintlayout:2.1.4"
    implementation "com.google.android.material:material:1.6.0"

    // async
    implementation "io.reactivex.rxjava2:rxjava:2.1.16"
    implementation "io.reactivex.rxjava2:rxandroid:2.0.1"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.6.4"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.6.4"

    // misc
    implementation "com.squareup.picasso:picasso:2.5.2"
    implementation "io.github.l4digital:fastscroll:2.0.1"
    implementation "com.github.abdularis:circularimageview:1.5"
    implementation "com.daimajia.androidanimations:library:2.4@aar"
    implementation "com.pushtorefresh.storio3:content-resolver:3.0.0"
}
